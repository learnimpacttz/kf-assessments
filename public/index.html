<meta name="theme-color" content="#354062">
<link rel="manifest" href="/manifest.json">
<meta name="mobile-web-app-capable" content="yes">

<body>
<header class="top"><div class="in">

  <nav id="nav" role="tablist"></nav>
</div></header>
<main class="wrap" id="app"><div class="empty">Loading…</div></main>
<div id="drawer" class="drawer" hidden><div class="dback" data-act="dClose"></div><aside class="dpanel" role="dialog" aria-label="Details"><div id="drawerBody"></div></aside></div>

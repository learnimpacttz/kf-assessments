<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#354062">
<title>KiuFunza Assessment — HQ Results</title>
<link rel="icon" href="/icon.svg" type="image/svg+xml">
<link rel="manifest" href="/manifest.json">
<link rel="stylesheet" href="/style.css">
<style>
  .grade-block { background: white; border-radius: 10px; box-shadow: 0 1px 3px rgba(0,0,0,.08); margin-bottom: 1.25rem; overflow: hidden; }
  .grade-block h3 { margin: 0; padding: .8rem 1.1rem; background: var(--indigo); color: white; font-size: .95rem; }
  .domain { padding: .9rem 1.1rem; }
  .domain h4 { margin: 0 0 .5rem; font-size: .75rem; color: #888; text-transform: uppercase; letter-spacing: .03em; }
</style>
</head>
<body>
<header>
  <h1>KiuFunza Assessment — HQ Results</h1>
  <p>Per-skill pass rates by grade (≥3/5 items correct, or ≥30/50 words for reading speed)</p>
</header>
<main>
  <div class="gate" id="gate">
    <p>HQ passphrase</p>
    <input type="password" id="passphrase" placeholder="Enter passphrase" onkeydown="if(event.key==='Enter') window.__gateUnlock()">
    <button class="primary" onclick="window.__gateUnlock()">Unlock</button>
    <div class="err" id="gate-err"></div>
  </div>
  <div id="protected" style="display:none">
    <div class="toolbar">
      <button class="small" onclick="exportResults()">Export results (CSV)</button>
      <button class="small" onclick="lockAndReload('kf_hq_passphrase')" style="margin-left:auto">Lock</button>
    </div>
    <div id="freshness" class="freshness"></div>
    <div id="content"></div>
    <p class="footer-link"><a href="/team">← Team view</a></p>
  </div>
</main>
<script src="/app.js"></script>
<script>
let lastSkills = {};

function render(data) {
  lastSkills = data.skills || {};
  document.getElementById('freshness').textContent = formatFreshness(data.fetched_at);
  const content = document.getElementById('content');

  if (!Object.keys(lastSkills).length) {
    content.innerHTML = '<p style="color:#999;font-size:.9rem">No results yet.</p>';
    return;
  }

  content.innerHTML = Object.entries(lastSkills).sort().map(([grade, domains]) => `
    <div class="grade-block">
      <h3>Grade ${grade}</h3>
      ${['reading','arithmetic'].map(domain => `
        <div class="domain">
          <h4>${domain}</h4>
          ${Object.entries(domains[domain] || {}).map(([label, s]) => {
            const pct = s.attempted ? Math.round((s.passed / s.attempted) * 100) : 0;
            return `<div class="bar-row">
              <div class="bar-label" title="${label}">${label}</div>
              <div class="bar-track"><div class="bar-fill" style="width:${pct}%"></div></div>
              <div class="bar-value">${pct}% (${s.passed}/${s.attempted})</div>
            </div>`;
          }).join('')}
        </div>
      `).join('')}
    </div>
  `).join('');
}

function exportResults() {
  const rows = [['Grade', 'Domain', 'Skill', 'Passed', 'Attempted', 'Pass Rate %']];
  Object.entries(lastSkills).forEach(([grade, domains]) => {
    ['reading', 'arithmetic'].forEach((domain) => {
      Object.entries(domains[domain] || {}).forEach(([label, s]) => {
        const pct = s.attempted ? Math.round((s.passed / s.attempted) * 100) : 0;
        rows.push([grade, domain, label, s.passed, s.attempted, pct]);
      });
    });
  });
  downloadCSV('kf-assessments-hq-results.csv', rows);
  toast('Results CSV downloaded');
}

initGate({
  storeKey: 'kf_hq_passphrase',
  endpoint: '/api/hq',
  gateEl: document.getElementById('gate'),
  protectedEl: document.getElementById('protected'),
  inputEl: document.getElementById('passphrase'),
  errEl: document.getElementById('gate-err'),
  onRender: render,
});
</script>
</body>
</html>

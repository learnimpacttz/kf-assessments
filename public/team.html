<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#354062">
<title>KiuFunza Assessment — Team View</title>
<link rel="icon" href="/icon.svg" type="image/svg+xml">
<link rel="manifest" href="/manifest.json">
<link rel="stylesheet" href="/style.css">
</head>
<body>
<header>
  <h1>KiuFunza Assessment — Team View</h1>
  <p>Progress, submissions by enumerator/school, data quality queries</p>
</header>
<main>
  <div class="gate" id="gate">
    <p>Team passphrase</p>
    <input type="password" id="passphrase" placeholder="Enter passphrase" onkeydown="if(event.key==='Enter') window.__gateUnlock()">
    <button class="primary" onclick="window.__gateUnlock()">Unlock</button>
    <div class="err" id="gate-err"></div>
  </div>
  <div id="protected" style="display:none">
    <div class="toolbar">
      <button class="small" onclick="exportSchools()">Export schools (CSV)</button>
      <button class="small" onclick="exportEnumerators()">Export enumerators (CSV)</button>
      <button class="small" onclick="lockAndReload('kf_team_passphrase')" style="margin-left:auto">Lock</button>
    </div>
    <div id="freshness" class="freshness"></div>
    <section>
      <h2 class="section-title">Data Quality — Possible Queries</h2>
      <div class="dq-card" id="dq"></div>
    </section>
    <section>
      <h2 class="section-title">Submissions by Enumerator</h2>
      <div class="table-wrap"><table id="enum-table"></table></div>
    </section>
    <section>
      <h2 class="section-title">Submissions by School</h2>
      <div class="table-wrap"><table id="school-table"></table></div>
    </section>
    <p class="footer-link"><a href="/">← Public view</a> · <a href="/hq">HQ results →</a></p>
  </div>
</main>
<script src="/app.js"></script>
<script>
let lastData = {};

function render(data) {
  lastData = data;
  document.getElementById('freshness').textContent = formatFreshness(data.fetched_at);

  const dq = data.dq_flags || {};
  document.getElementById('dq').innerHTML = `
    <div>Missing enumerator name: <strong>${dq.missing_enumerator ?? 0}</strong></div>
    <div>Missing school code: <strong>${dq.missing_school ?? 0}</strong></div>
    <div>Missing grade: <strong>${dq.missing_grade ?? 0}</strong></div>
    <div>Submitted but no skill data recorded (needs follow-up): <strong>${dq.submitted_but_no_skill_data ?? 0}</strong></div>
  `;

  const enumRows = Object.entries(data.by_enumerator || {}).sort((a,b) => b[1]-a[1]);
  document.getElementById('enum-table').innerHTML =
    `<tr><th>Enumerator</th><th>Submissions</th></tr>` +
    (enumRows.map(([name,n]) => `<tr><td>${name}</td><td>${n}</td></tr>`).join('') || '<tr><td colspan=2>No data yet</td></tr>');

  const schoolRows = Object.entries(data.by_school || {}).sort((a,b) => b[1].count-a[1].count);
  document.getElementById('school-table').innerHTML =
    `<tr><th>School</th><th>Code</th><th>Total</th><th>By Grade</th></tr>` +
    (schoolRows.map(([code,s]) => `<tr><td>${s.name || code}</td><td>${code}</td><td>${s.count}</td><td>G1: ${s.by_grade[1]||0} · G2: ${s.by_grade[2]||0} · G3: ${s.by_grade[3]||0}</td></tr>`).join('') || '<tr><td colspan=4>No data yet</td></tr>');
}

function exportSchools() {
  const rows = [['School', 'Code', 'Total', 'Grade 1', 'Grade 2', 'Grade 3']];
  Object.entries(lastData.by_school || {}).forEach(([code, s]) => {
    rows.push([s.name || code, code, s.count, s.by_grade[1]||0, s.by_grade[2]||0, s.by_grade[3]||0]);
  });
  downloadCSV('kf-assessments-schools.csv', rows);
  toast('Schools CSV downloaded');
}

function exportEnumerators() {
  const rows = [['Enumerator', 'Submissions']];
  Object.entries(lastData.by_enumerator || {}).forEach(([name, n]) => rows.push([name, n]));
  downloadCSV('kf-assessments-enumerators.csv', rows);
  toast('Enumerators CSV downloaded');
}

initGate({
  storeKey: 'kf_team_passphrase',
  endpoint: '/api/team',
  gateEl: document.getElementById('gate'),
  protectedEl: document.getElementById('protected'),
  inputEl: document.getElementById('passphrase'),
  errEl: document.getElementById('gate-err'),
  onRender: render,
});
</script>
</body>
</html>

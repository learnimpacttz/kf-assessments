name = "kf-assessments"
main = "src/index.js"
compatibility_date = "2026-08-05"

[assets]
directory = "public"
binding = "ASSETS"

[[kv_namespaces]]
binding = "DASHBOARD_KV"
id = "173c4a9bdc9f4c67aa9eadc619334e3e"

# Daily kickoff (04:00 UTC) checks for submissions newer than the last
# synced watermark; once-a-minute tick advances a multi-page sync one page
# at a time if there's more than ~1000 new records since the last check.
# No-op ticks when nothing is in progress. No-op entirely until
# KOBO_ASSET_ID + KOBO_TOKEN are both set.
[triggers]
crons = ["0 4 * * *", "* * * * *"]

# Not secrets — safe to set here directly.
# Token goes in via `wrangler secret put KOBO_TOKEN`, never here.
[vars]
KOBO_ASSET_ID = "aDAUSHKkk9aqDbwZfAuxbL"
KOBO_SERVER = "kf.kobotoolbox.org"
